# ─── Prometheus — Local Development Config ────────────────────────────────────
# P6-07 integration: scrapes metrics from OTel Collector and API

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OTel Collector self-monitoring
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # SatQuery API metrics (via OTel)
  - job_name: "satquery-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
