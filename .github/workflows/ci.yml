# ─────────────────────────────────────────────────────────────────────────────
# CI — SatQuery AI P1 Backend
# Runs on every PR to `develop` or `main` and on direct pushes.
# Stages: lint → unit → integration → contract → security → gate
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHONPATH: "."
  PYTHON_VERSION: "3.10"
  # Auth env vars — force HS256 for all test jobs (no real OIDC provider in CI)
  AUTH_ALGORITHM: "HS256"
  AUTH_SECRET_KEY: "test-secret-key-not-for-production-use-at-all"
  AUTH_AUDIENCE: "satquery-api"
  AUTH_ISSUER: "https://auth.satquery.test"

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Black format check
        run: black --check --diff services packages tests ml conftest.py

      - name: Flake8 lint
        run: flake8 services packages tests ml

      - name: Mypy type check
        run: mypy services packages ml --ignore-missing-imports

      # P3-15. Verifies that reports/evaluation.md was produced by the code on
      # this branch -- NOT that the numbers in it are right, which would need the
      # 533 MB benchmark set that is deliberately gitignored. A gate that skipped
      # when the data is absent would report green while checking nothing.
      #
      # What it catches: someone changes Otsu, the postprocessing or the loss, and
      # the committed accuracy figures quietly stop describing the code. That is
      # the specific defect that sank the previous iteration of this project.
      - name: Evaluation report is not stale (P3-15)
        run: PYTHONPATH="$PWD" python ml/scripts/check_report_fresh.py

  # ── 2. Unit tests ───────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -m unit --tb=short -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: .pytest_cache/

  # ── 3. Integration tests ────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest -m integration --tb=short -v

  # ── 4. Contract tests ───────────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run contract tests
        run: pytest -m contract --tb=short -v

  # ── 5. Security scan ────────────────────────────────────────────────────────
  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bandit SAST
        run: bandit -r services packages -ll -ii

  # ── 6. OpenAPI Export & Compatibility ───────────────────────────────────────
  openapi-compat:
    name: OpenAPI Compatibility (oasdiff)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export current OpenAPI schemas
        run: python scripts/export_openapi.py

      - name: Export baseline OpenAPI schemas from main
        run: |
          git checkout main || echo "No main branch locally"
          mkdir -p docs/baseline
          if [ -f scripts/export_openapi.py ]; then
            python scripts/export_openapi.py
            cp docs/openapi/gateway.json docs/baseline/gateway.json
            cp docs/openapi/mission.json docs/baseline/mission.json
          else
            echo "No export script on main branch yet. Skipping baseline and mocking empty spec."
            echo '{"openapi": "3.1.0", "info": {"title": "stub", "version": "1"}, "paths": {}}' > docs/baseline/gateway.json
            echo '{"openapi": "3.1.0", "info": {"title": "stub", "version": "1"}, "paths": {}}' > docs/baseline/mission.json
          fi
          git checkout -
          
          # Re-export the schemas for the current branch so docs/openapi/ contains the PR's version,
          # not the version generated while we were checked out on main.
          python scripts/export_openapi.py

      - name: Run oasdiff (Gateway)
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: docs/baseline/gateway.json
          revision: docs/openapi/gateway.json
          format: text
          fail-on-diff: true

  # ── 7. Frontend Client Generation ───────────────────────────────────────────
  client-generation:
    name: TypeScript Client Generation
    runs-on: ubuntu-latest
    needs: openapi-compat
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and Export schemas
        run: |
          pip install -r requirements.txt
          python scripts/export_openapi.py

      - name: Generate TypeScript Client
        run: npx @openapitools/openapi-generator-cli generate -i docs/openapi/gateway.json -g typescript-axios -o clients/ts-client --skip-validate-spec

  # ── 8. All-green gate ───────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate (All Green)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, contract-tests, security, client-generation]
    steps:
      - run: echo "All CI checks passed ✅"
